[project]
name = "field-assistant-backend"
version = "0.1.0"
description = "AI-assisted troubleshooting & ticketing platform for manufacturing plant vision-based inspection systems"
requires-python = ">=3.10,<3.11"
dependencies = [
    # --- web ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # --- db ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",            # sync driver for alembic + langgraph checkpointer
    "alembic>=1.13",
    "pgvector>=0.3",
    # --- config / validation ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # --- auth ---
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7.4 is incompatible with bcrypt>=4.1 (missing __about__)
    # --- redis / jobs ---
    "redis>=5.0",
    "arq>=0.26",
    # --- storage ---
    "aioboto3>=13.0",
    # --- agent / llm ---
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langfuse>=2.40,<3",
    "tiktoken>=0.7",
    # --- qr / pdf ---
    "segno>=1.6",
    "reportlab>=4.2",
    # --- kb ingestion ---
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # --- bulk import ---
    "openpyxl>=3.1",
    # --- misc ---
    "httpx>=0.27",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# session-scoped so app.db.engine's module-level asyncpg pool (a singleton,
# correct for production) isn't reused across a different event loop per test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
